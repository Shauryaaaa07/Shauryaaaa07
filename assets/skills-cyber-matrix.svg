<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="100%" height="330">
  <defs>
    <linearGradient id="matrix-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#39c5bb" />
    </linearGradient>
  </defs>

  <style>
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .radar-beam {
      transform-origin: 685px 175px;
      animation: radarSpin 6s linear infinite;
    }
    .pulse-ring {
      animation: pulse 2.5s infinite ease-out;
    }
    @keyframes pulse {
      0% { r: 15px; opacity: 0.9; }
      100% { r: 85px; opacity: 0; }
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="326" rx="14" fill="url(#matrix-bg)" stroke="#30363d" stroke-width="1.5" />

  <!-- Terminal Header -->
  <g transform="translate(25, 28)">
    <rect x="0" y="-12" width="8" height="16" rx="2" fill="#58a6ff" />
    <text x="18" y="0" fill="#f0f6fc" font-size="14" font-weight="bold" font-family="'SF Pro Display', 'Segoe UI', sans-serif">CYBERMETRIC SKILL RADAR // RUNTIME PROFICIENCY</text>
    <text x="800" y="0" fill="#58a6ff" font-size="11" font-family="'Fira Code', monospace" text-anchor="end">SYS://BENCHMARK_OK</text>
  </g>
  <line x1="20" y1="42" x2="830" y2="42" stroke="#21262d" stroke-width="1" />

  <!-- Left Side: Interactive Skills Progress Bars -->
  
    <!-- Skill: Computer Vision & CNNs -->
    <g transform="translate(40, 75)">
      <text x="0" y="0" fill="#f0f6fc" font-size="13" font-weight="bold" font-family="'SF Pro Display', 'Segoe UI', sans-serif">Computer Vision & CNNs</text>
      <text x="490" y="0" fill="#58a6ff" font-size="12" font-weight="bold" font-family="'Fira Code', monospace" text-anchor="end">94%</text>
      <text x="0" y="15" fill="#8b949e" font-size="10" font-family="'Fira Code', monospace">OpenCV, Custom 4-Layer CNN, Real-Time Inference</text>
      
      <!-- Track Background -->
      <rect x="0" y="24" width="490" height="8" rx="4" fill="#21262d" />
      
      <!-- Animated Active Bar -->
      <rect x="0" y="24" width="432" height="8" rx="4" fill="#58a6ff">
        <animate attributeName="width" from="0" to="432" dur="1.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      </rect>
    </g>
    
    <!-- Skill: Machine Learning & Data -->
    <g transform="translate(40, 133)">
      <text x="0" y="0" fill="#f0f6fc" font-size="13" font-weight="bold" font-family="'SF Pro Display', 'Segoe UI', sans-serif">Machine Learning & Data</text>
      <text x="490" y="0" fill="#bc8cff" font-size="12" font-weight="bold" font-family="'Fira Code', monospace" text-anchor="end">90%</text>
      <text x="0" y="15" fill="#8b949e" font-size="10" font-family="'Fira Code', monospace">Scikit-Learn, Pandas, NumPy, Classification</text>
      
      <!-- Track Background -->
      <rect x="0" y="24" width="490" height="8" rx="4" fill="#21262d" />
      
      <!-- Animated Active Bar -->
      <rect x="0" y="24" width="413" height="8" rx="4" fill="#bc8cff">
        <animate attributeName="width" from="0" to="413" dur="1.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      </rect>
    </g>
    
    <!-- Skill: Core Engineering & DSA -->
    <g transform="translate(40, 191)">
      <text x="0" y="0" fill="#f0f6fc" font-size="13" font-weight="bold" font-family="'SF Pro Display', 'Segoe UI', sans-serif">Core Engineering & DSA</text>
      <text x="490" y="0" fill="#39c5bb" font-size="12" font-weight="bold" font-family="'Fira Code', monospace" text-anchor="end">92%</text>
      <text x="0" y="15" fill="#8b949e" font-size="10" font-family="'Fira Code', monospace">Python, C++, Problem Solving, Optimization</text>
      
      <!-- Track Background -->
      <rect x="0" y="24" width="490" height="8" rx="4" fill="#21262d" />
      
      <!-- Animated Active Bar -->
      <rect x="0" y="24" width="423" height="8" rx="4" fill="#39c5bb">
        <animate attributeName="width" from="0" to="423" dur="1.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      </rect>
    </g>
    
    <!-- Skill: Full-Stack & APIs -->
    <g transform="translate(40, 249)">
      <text x="0" y="0" fill="#f0f6fc" font-size="13" font-weight="bold" font-family="'SF Pro Display', 'Segoe UI', sans-serif">Full-Stack & APIs</text>
      <text x="490" y="0" fill="#f0883e" font-size="12" font-weight="bold" font-family="'Fira Code', monospace" text-anchor="end">86%</text>
      <text x="0" y="15" fill="#8b949e" font-size="10" font-family="'Fira Code', monospace">Flask, JavaScript, RESTful APIs, SQLite/MySQL</text>
      
      <!-- Track Background -->
      <rect x="0" y="24" width="490" height="8" rx="4" fill="#21262d" />
      
      <!-- Animated Active Bar -->
      <rect x="0" y="24" width="395" height="8" rx="4" fill="#f0883e">
        <animate attributeName="width" from="0" to="395" dur="1.5s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      </rect>
    </g>
    

  <!-- Divider Line -->
  <line x1="565" y1="55" x2="565" y2="310" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Right Side: Animated Cyber Radar Display -->
  <g transform="translate(0, 0)">
    <!-- Radar Base Circles -->
    <circle cx="685" cy="175" r="85" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    <circle cx="685" cy="175" r="60" fill="none" stroke="#21262d" stroke-width="1" />
    <circle cx="685" cy="175" r="35" fill="none" stroke="#21262d" stroke-width="1" />
    <circle cx="685" cy="175" r="10" fill="#58a6ff" fill-opacity="0.3" stroke="#58a6ff" stroke-width="1.5" />

    <!-- Radar Crosshairs -->
    <line x1="600" y1="175" x2="770" y2="175" stroke="#21262d" stroke-width="1" />
    <line x1="685" y1="90" x2="685" y2="260" stroke="#21262d" stroke-width="1" />

    <!-- Pulsing Radar Ping Wave -->
    <circle class="pulse-ring" cx="685" cy="175" r="20" fill="none" stroke="#58a6ff" stroke-width="1.5" />

    <!-- Rotating Radar Sweep Beam -->
    <g class="radar-beam">
      <path d="M 685 175 L 770 175 A 85 85 0 0 0 745 115 Z" fill="url(#neon-cyan)" fill-opacity="0.25" />
      <line x1="685" y1="175" x2="770" y2="175" stroke="#58a6ff" stroke-width="2" />
    </g>

    <!-- Detected Target Blips with glow -->
    <circle cx="725" cy="140" r="3.5" fill="#39c5bb" />
    <circle cx="650" cy="215" r="3" fill="#bc8cff" />
    <circle cx="660" cy="130" r="3.5" fill="#f0883e" />

    <!-- Label Below Radar -->
    <text x="685" y="285" fill="#8b949e" font-size="10" font-family="'Fira Code', monospace" text-anchor="middle">ACTIVE RADAR SWEEP</text>
    <text x="685" y="300" fill="#58a6ff" font-size="9" font-family="'Fira Code', monospace" text-anchor="middle">TARGET: HIGH IMPACT IMPACT</text>
  </g>
</svg>