<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="170">
  <defs>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="50%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <style>
    @keyframes typing {
      0%, 15% { opacity: 0; }
      20%, 80% { opacity: 1; }
      85%, 100% { opacity: 0; }
    }
    @keyframes cursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .text-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 28px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .text-sub {
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 15px;
      fill: #3fb950;
    }
    .text-dim {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 13px;
      fill: #8b949e;
    }
    .cursor {
      animation: cursor 0.8s infinite;
      fill: #2ea043;
    }
  </style>

  <!-- Clean Container -->
  <rect x="1" y="1" width="848" height="168" rx="10" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Subtle Top Accent Line in GitHub Green -->
  <rect x="1" y="1" width="848" height="3" rx="1" fill="url(#green-grad)" />

  <!-- Terminal Control Dots -->
  <circle cx="24" cy="22" r="5" fill="#ff5f56" />
  <circle cx="40" cy="22" r="5" fill="#ffbd2e" />
  <circle cx="56" cy="22" r="5" fill="#27c93f" />
  <text x="76" y="26" font-family="'Fira Code', monospace" font-size="11" fill="#6e7681">shaurya@github-workspace: ~</text>

  <!-- Divider -->
  <line x1="1" y1="40" x2="849" y2="40" stroke="#21262d" stroke-width="1" />

  <!-- Content -->
  <g transform="translate(32, 80)">
    <text x="0" y="0" class="text-title">Hi there, I'm Shaurya Pratap Singh 👋</text>
    <text x="0" y="32" class="text-sub">&gt; Software Engineer • Data Analyst • AI &amp; Computer Vision</text>
    <rect x="580" y="18" width="8" height="16" class="cursor" />
    <text x="0" y="62" class="text-dim">B.Tech Computer Science &amp; Engineering • Smart India Hackathon '24 • Prompt Developer</text>
  </g>
</svg>